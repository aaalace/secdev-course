services:
  postgres:
    image: postgres:16-alpine
    container_name: issue-lite-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5092}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-issueuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issuepass}
      POSTGRES_DB: ${POSTGRES_DB:-issuedb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - issue-lite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-issueuser} -d ${POSTGRES_DB:-issuedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    read_only: false
    tmpfs:
      - /tmp
      - /run

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issue-lite-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-issueuser}:${POSTGRES_PASSWORD:-issuepass}@postgres:5432/${POSTGRES_DB:-issuedb}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - issue-lite-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
      # - seccomp=seccomp-profile.json
      # Uncomment the following line if AppArmor is available on your system
      # - apparmor=issue-lite-app
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /app/__pycache__:uid=1000,gid=1000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
    driver: local

networks:
  issue-lite-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
