name: SBOM & SCA

on:
  push:
    paths:
      - 'requirements*.txt'
      - 'app/**'
      - '.github/workflows/ci-sbom-sca.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.17.0

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.84.0

      - name: Generate SBOM
        run: |
          mkdir -p EVIDENCE/P09
          syft dir:. -o cyclonedx-json > EVIDENCE/P09/sbom.json
          echo "SBOM generated at EVIDENCE/P09/sbom.json"
          echo "SBOM size: $(wc -c < EVIDENCE/P09/sbom.json) bytes"

      - name: Run SCA with Grype
        run: |
          grype sbom:EVIDENCE/P09/sbom.json -o json > EVIDENCE/P09/sca_report.json || true
          echo "SCA report generated at EVIDENCE/P09/sca_report.json"

      - name: Generate SCA Summary
        run: |
          cat > EVIDENCE/P09/sca_summary.md << 'EOF'
          # SCA Summary Report

          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Vulnerability Statistics

          EOF

          # Parse JSON and count by severity
          python3 << 'PYEOF' >> EVIDENCE/P09/sca_summary.md
          import json
          from collections import Counter

          try:
              with open('EVIDENCE/P09/sca_report.json', 'r') as f:
                  report = json.load(f)

              matches = report.get('matches', [])

              if not matches:
                  print("**No vulnerabilities found!**\n")
              else:
                  severities = Counter(m.get('vulnerability', {}).get('severity', 'Unknown') for m in matches)

                  print(f"**Total vulnerabilities:** {len(matches)}\n")
                  print("| Severity | Count |")
                  print("|----------|-------|")
                  for sev in ['Critical', 'High', 'Medium', 'Low', 'Negligible', 'Unknown']:
                      if sev in severities:
                          print(f"| {sev} | {severities[sev]} |")

                  print("\n## Critical & High Severity Issues\n")

                  critical_high = [m for m in matches if m.get('vulnerability', {}).get('severity') in ['Critical', 'High']]

                  if critical_high:
                      for vuln in critical_high[:10]:  # Show first 10
                          v = vuln.get('vulnerability', {})
                          artifact = vuln.get('artifact', {})
                          print(f"### {v.get('id', 'N/A')}")
                          print(f"- **Severity:** {v.get('severity', 'N/A')}")
                          print(f"- **Package:** {artifact.get('name', 'N/A')} @ {artifact.get('version', 'N/A')}")
                          print(f"- **Description:** {v.get('description', 'N/A')[:200]}...")
                          if v.get('fixedInVersion'):
                              print(f"- **Fixed in:** {v.get('fixedInVersion')}")
                          print()

                      if len(critical_high) > 10:
                          print(f"\n_... and {len(critical_high) - 10} more Critical/High issues. See full report._\n")
                  else:
                      print("No Critical or High severity vulnerabilities found.\n")

                  print("\n## Action Items\n")
                  print("- Review Critical/High vulnerabilities for immediate action")
                  print("- Consider updating affected packages to fixed versions")
                  print("- Document waivers for accepted risks in `policy/waivers.yml`")
                  print("- Track remediation in GitHub Issues")

          except Exception as e:
              print(f"Error parsing SCA report: {e}\n")
              print("See `EVIDENCE/P09/sca_report.json` for raw results.")
          PYEOF

          echo "SCA summary generated at EVIDENCE/P09/sca_summary.md"

      - name: Display Summary
        if: always()
        run: |
          echo "================================"
          echo "SBOM & SCA Results Summary"
          echo "================================"
          cat EVIDENCE/P09/sca_summary.md

      - name: Upload EVIDENCE artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-sca-evidence-${{ github.sha }}
          path: EVIDENCE/P09/
          retention-days: 90

      - name: Check for Critical vulnerabilities
        run: |
          CRITICAL_COUNT=$(python3 -c "
          import json
          with open('EVIDENCE/P09/sca_report.json', 'r') as f:
              report = json.load(f)
          matches = report.get('matches', [])
          critical = sum(1 for m in matches if m.get('vulnerability', {}).get('severity') == 'Critical')
          print(critical)
          " || echo "0")

          echo "Critical vulnerabilities found: $CRITICAL_COUNT"

          if [ "$CRITICAL_COUNT" -gt "0" ]; then
            echo "Warning: Found $CRITICAL_COUNT Critical vulnerabilities"
            echo "Review EVIDENCE/P09/sca_summary.md and consider fixes or waivers"
            # Uncomment to fail on Critical:
            # exit 1
          fi
