name: SAST & Secrets

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'security/**'
      - '.gitleaks.toml'
      - '.github/workflows/ci-sast-secrets.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install semgrep==1.95.0
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Semgrep
        run: |
          mkdir -p EVIDENCE/P10
          semgrep scan --config=p/ci --config=security/semgrep/rules.yml --sarif -o EVIDENCE/P10/semgrep.sarif || true
          semgrep scan --config=p/ci --config=security/semgrep/rules.yml --json -o EVIDENCE/P10/semgrep.json || true

      - name: Gitleaks
        run: |
          gitleaks detect --config=.gitleaks.toml --report-format=json --report-path=EVIDENCE/P10/gitleaks.json --no-git || true

      - name: Summary
        if: always()
        run: |
          python3 << 'EOF'
          import json
          from collections import Counter
          from pathlib import Path

          lines = [
              "# SAST & Secrets Summary",
              f"**Commit:** ${{ github.sha }}",
              f"**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              ""
          ]

          # Semgrep
          lines.append("## Semgrep")
          sp = Path("EVIDENCE/P10/semgrep.json")
          if sp.exists():
              data = json.load(sp.open())
              results = data.get('results', [])
              if not results:
                  lines.append("No issues")
              else:
                  sev = Counter(r.get('extra', {}).get('severity', '?') for r in results)
                  lines.append(f"Total: {len(results)}")
                  for s in ['ERROR', 'WARNING', 'INFO']:
                      if s in sev:
                          lines.append(f"- {s}: {sev[s]}")
          else:
              lines.append("No report")

          # Gitleaks
          lines.append("\n## Gitleaks")
          gp = Path("EVIDENCE/P10/gitleaks.json")
          if gp.exists():
              data = json.load(gp.open())
              secrets = data if isinstance(data, list) else []
              if not secrets:
                  lines.append("No secrets")
              else:
                  lines.append(f"Total: {len(secrets)}")
                  rules = Counter(s.get('RuleID', '?') for s in secrets)
                  for r, c in rules.most_common(5):
                      lines.append(f"- {r}: {c}")
          else:
              lines.append("No report")

          Path('EVIDENCE/P10/sast_summary.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-secrets-${{ github.sha }}
          path: EVIDENCE/P10/
          retention-days: 90
